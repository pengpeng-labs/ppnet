[package]
name = "ppnet"
version = "0.2.0"
language = "0.4.0"
default-target = "protocol-smoke"

[targets.protocol-smoke]
kind = "executable"
root = "tests/protocol_smoke.pp"
target = "x86_64-unknown-none"

[targets.qemu-smoke]
kind = "executable"
root = "tests/qemu_smoke.pp"
target = "x86_64-unknown-none"

[targets.qemu-http]
kind = "executable"
root = "tests/qemu_http.pp"
target = "x86_64-unknown-none"

[targets.qemu-https]
kind = "executable"
root = "tests/qemu_https.pp"
target = "x86_64-unknown-none"

[dependencies]
oscore = { git = "https://github.com/pengpeng-labs/oscore.git", tag = "v0.1.3" }
